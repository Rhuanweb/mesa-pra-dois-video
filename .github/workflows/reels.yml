name: Reels do dia

on:
  schedule:
    - cron: '20 3 * * *'   # 00h20 em Brasília, depois que a noite fecha (00h05)
  push:
    branches: [main]
    paths: ['render.js', '.github/workflows/reels.yml', 'teste.txt']
  workflow_dispatch:
    inputs:
      pausado:
        description: 'Só gerar o vídeo, sem publicar no Instagram'
        type: boolean
        default: true
      refazer:
        description: 'Refazer o roteiro e a narração de hoje'
        type: boolean
        default: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji
      - name: Renderizar e subir
        env:
          MESA_VIDEO_TOKEN: ${{ secrets.MESA_VIDEO_TOKEN }}
          PAUSADO: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.pausado)) && '1' || '' }}
          REFAZER: ${{ github.event_name == 'workflow_dispatch' && inputs.refazer && '1' || '' }}
        run: node render.js
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: reels
          path: |
            saida/reels.mp4
            saida/legenda.txt
          retention-days: 7
          if-no-files-found: ignore
